spring.application.name=fitnessapp
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.datasource.url=jdbc:mysql://localhost:3306/fitnessapp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Set JWT_SECRET to a private value of at least 32 characters before starting the service.
security.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8100

